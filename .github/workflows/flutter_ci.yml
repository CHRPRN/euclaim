name: Flutter CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
      - name: Install dependencies
        run: |
          cd euclaim_mobile
          flutter pub get
          cd ../euclaim_admin
          flutter pub get
      - name: Run Unit & Widget Tests
        run: |
          cd euclaim_mobile
          flutter test
          cd ../euclaim_admin
          flutter test
