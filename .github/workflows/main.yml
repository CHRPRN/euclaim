name: EUClaim CI/CD

on:
  push:
    branches: [ main, production ]
  pull_request:
    branches: [ main ]

jobs:
  qc:
    name: Quality Control (Analyze & Unit Tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          cache: true
      
      - name: Install dependencies (Mobile)
        run: |
          cd euclaim_mobile
          flutter pub get
      
      - name: Static Analysis (Mobile)
        run: |
          cd euclaim_mobile
          flutter analyze
          
      - name: Run Unit Tests (Mobile)
        run: |
          cd euclaim_mobile
          flutter test --coverage

      - name: Install dependencies (Web Admin)
        run: |
          cd euclaim_admin
          flutter pub get
          
      - name: Static Analysis (Web Admin)
        run: |
          cd euclaim_admin
          flutter analyze

  android-build:
    name: Android Release Build (AAB)
    needs: qc
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          cache: true

      - name: Decode Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > euclaim_mobile/android/app/upload-keystore.jks

      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" > euclaim_mobile/android/key.properties
          echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> euclaim_mobile/android/key.properties
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" >> euclaim_mobile/android/key.properties
          echo "storeFile=upload-keystore.jks" >> euclaim_mobile/android/key.properties

      - name: Build AAB
        run: |
          cd euclaim_mobile
          flutter build appbundle --release

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: euclaim_mobile/build/app/outputs/bundle/release/app-release.aab

  web-deploy:
    name: Web Admin Dashboard Deploy
    needs: qc
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          cache: true
          
      - name: Build Web
        run: |
          cd euclaim_admin
          flutter build web --release
          
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_EUCLAIM_95176 }}'
          channelId: live
          projectId: euclaim-95176
